<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขอทำบัตรผู้รับเหมา QTC</title><!-- ===== โลโก้ที่แถบเบราว์เซอร์ + ไอคอนหน้าจอโฮม =====
     ต้องอัปโหลดไฟล์เหล่านี้ไว้โฟลเดอร์เดียวกับ index.html:
     favicon-32.png, icon-180.png, icon-192.png, icon-512.png, manifest.webmanifest -->
<link rel="icon" type="image/png" sizes="32x32" href="contractor32.png">
<link rel="icon" type="image/png" sizes="192x192" href="contractor192.png">
<link rel="apple-touch-icon" sizes="180x180" href="contractor180.png">
<link rel="manifest" href="manifest.webmanifest">
 
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  iframe { width: 100%; height: 100vh; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="appFrame" scrolling="yes" frameborder="0"></iframe>

<script>
  // ฐาน URL ของ Apps Script Web App (อย่าใส่ query string ต่อท้ายตรงนี้)
  var BASE_URL = "https://script.google.com/macros/s/AKfycbxs3Y8qIgRbb5S7RB4uRaDjhiCDP5zwNaytah-eh9fdbQ_0xGq634xgYxt0vDKl1sMM/exec";

  // สำคัญ: ต้องต่อ query string ที่ผู้ใช้แนบมา (เช่น ?page=checkin&id=xxx จาก QR Code
  // หรือ ?token=...&page=approve จากลิงก์ในอีเมล) เข้ากับ URL ปลายทางเสมอ
  // ไม่เช่นนั้นค่าพารามิเตอร์เหล่านี้จะหายไปก่อนถึงเว็บแอป และระบบเช็คอิน/auto-login จะไม่ทำงาน
  var finalUrl = BASE_URL + window.location.search;

  document.getElementById("appFrame").src = finalUrl;
</script>
</body>
</html>
